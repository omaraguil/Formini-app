# ======================
# APPLICATION
# ======================
spring.application.name=ApiGateway
server.port=8085

# ======================
# EUREKA DISCOVERY
# ======================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Activation de la découverte automatique des services
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-name=true

# ======================
# SECURITY - KEYCLOAK
# ======================
# URL du realm Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/myrealm

# Facultatif : Si tu veux vérifier un claim spécifique (roles)
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/myrealm/protocol/openid-connect/certs

