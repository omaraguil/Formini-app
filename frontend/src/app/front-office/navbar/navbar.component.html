<nav class="navbar">
  <!-- Partie gauche avec logo et navigation -->
  <div class="navbar-left">
    <div class="logo-container">
      <!-- Utilisation du logo existant -->
      <div class="logo-icon">
        <div class="cube">
          <div class="cube-face cube-front"></div>
          <div class="cube-face cube-top"></div>
          <div class="cube-face cube-right"></div>
        </div>
      </div>
      <span class="logo-text">
        Form<span class="logo-i-container">i</span>ni
      </span>
    </div>

    <!-- Menu de navigation -->
    <div class="nav-menu">
      <a
        [routerLink]="['']"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        Home
      </a>
      <a [routerLink]="['/about']" routerLinkActive="active" class="nav-link">
        About Us
      </a>

      <!-- Lien Évaluations (NOUVEAU) -->
      <a
        *ngIf="user.role === 'TRAINER'"
        [routerLink]="['/dashboard']"
        routerLinkActive="active"
        class="nav-link"
      >
        Evaluations
      </a>

      <!-- Session Management Dropdown -->
      <div
        class="dropdown-container"
        (mouseenter)="showSessionDropdown = true"
        (mouseleave)="showSessionDropdown = false"
      >
        <a
          class="nav-link dropdown-trigger"
          [class.active]="isSessionRouteActive()"
        >
          Session Management
          <svg
            class="dropdown-arrow"
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <path d="M6 9l6 6 6-6" stroke-width="2" />
          </svg>
        </a>

        <!-- Dropdown menu -->
        <div class="dropdown-menu" *ngIf="showSessionDropdown">
          <a
            [routerLink]="['/sessions']"
            routerLinkActive="active"
            class="dropdown-item"
          >
            <span class="dropdown-icon">🎯</span>
            Sessions
          </a>
          <a
            [routerLink]="['/planning']"
            routerLinkActive="active"
            class="dropdown-item"
          >
            <span class="dropdown-icon">📅</span>
            Plannings
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Partie droite avec infos utilisateur -->
  <div class="navbar-right">
    <div class="user-info">
      <div class="user-details">
        <div class="user-name">{{ user?.username }}</div>
        <div class="user-role">{{ user?.roles || 'No Role'}}</div>
      </div>
      <div class="user-avatar">
        <img [src]="avatarUrl" alt="Avatar" class="avatar-image" />
      </div>
      <div class="logout-button">
        <button class="btn-logout" (click)="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-width="2" stroke-linecap="round"/>
            <polyline points="16 17 21 12 16 7" stroke-width="2" stroke-linecap="round"/>
            <line x1="21" y1="12" x2="9" y2="12" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Logout
        </button>
      </div>
    </div>
  </div>
</nav>
